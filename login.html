<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Login | LT BPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
  <style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }
    .login-card {
        background: var(--white);
        border: 4px solid var(--tertiary);
        border-radius: 12px;
        box-shadow: 8px 8px 0 var(--secondary);
        padding: 40px;
        width: 100%;
        max-width: 450px;
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header h2 {
        font-family: var(--font-sans);
        color: var(--primary);
        font-size: 2rem;
        margin-bottom: 8px;
    }
    .login-header p {
        color: var(--tertiary);
        font-size: 0.95rem;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-family: var(--font-sans);
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--tertiary);
        font-size: 0.9rem;
    }
    .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--tertiary);
        border-radius: 8px;
        font-family: var(--font-body);
        font-size: 1rem;
        transition: all 0.2s;
    }
    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 4px 4px 0 rgba(27, 77, 62, 0.2);
    }
    .btn-login {
        width: 100%;
        background-color: var(--primary);
        color: var(--white);
        border: 2px solid var(--tertiary);
        padding: 14px;
        font-family: var(--font-sans);
        font-weight: 700;
        font-size: 1rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 10px;
    }
    .btn-login:hover {
        background-color: var(--tertiary);
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0 var(--secondary);
    }
    .btn-login:active {
        transform: translate(0, 0);
        box-shadow: 0 0 0 var(--secondary);
    }
    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--tertiary);
        text-decoration: underline;
        font-weight: 600;
    }
    .forgot-password:hover {
        color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container playful-layout">
    <!-- Header -->
    <header class="header-playful">
        <a href="index.html" class="logo">
            <span class="logo-star">*</span>
            <span class="logo-text">Lebanon Trail</span>
        </a>
        <nav class="nav-playful">
            <a href="index.html">Home</a>
            <a href="competitions.html">Competitions</a>
            <a href="officers.html">Officers</a>
            <a href="#">Contact</a>
        </nav>
        <div class="header-actions">
            <div class="icon-btn search-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="7" />
                    <path d="M 6 10.5 A 4.5 4.5 0 0 1 10.5 6" />
                    <path d="M15.5 14 L20 18.5 A 1.5 1.5 0 0 1 17.88 20.62 L13.38 16.12" />
                </svg>
            </div>
            <div class="icon-btn notif-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 10 5.5 A 2 2 0 0 1 14 5.5" />
                    <path d="M 4 18 C 6 18, 7 16, 7 14 L 7 10 A 5 5 0 0 1 17 10 L 17 14 C 17 16, 18 18, 20 18 Z" />
                    <path d="M 9.5 18 A 2.5 2.5 0 0 0 14.5 18" />
                    <path d="M 8.5 10 A 3.5 3.5 0 0 1 11 6.6" />
                </svg>
            </div>
            <a href="login.html" class="icon-btn profile-icon" style="background-color: var(--neutral);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 2 9 L 12 4 L 22 9 L 12 14 Z" />
                    <path d="M 6 11 V 16 C 6 19, 18 19, 18 16 V 11" />
                    <path d="M 13 9.5 L 21 9.5 V 15.5" />
                    <circle cx="21" cy="17" r="1.5" />
                    <path d="M 20 18.2 L 19 22.5 C 20 23.5, 22 23.5, 23 22.5 L 22 18.2" />
                </svg>
            </a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Officer Portal</h2>
                <p>Secure login for chapter officers</p>
            </div>
            <form action="#" method="POST" id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter your credentials" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Sign In</button>
                <a href="#" class="forgot-password">Need help logging in?</a>
            </form>
        </div>
    </main>
  </div>
</body>
</html>
